substitutions:
  _REGION: us-east1
  _SERVICE: nyc-cleaning
  _AUDIT_JOB: nyc-cleaning-legacy-audit
  _REPOSITORY: nyc-cleaning
  _RUNTIME_SA: nyc-cleaning-runtime@nyc-cleaning.iam.gserviceaccount.com
  _CLOUD_SQL_CONNECTION: nyc-cleaning:us-east1:nyc-cleaning-mysql
  _DB_USER: nyc_app
  _DB_NAME: nyc_cleaning
  _DB_PASS_SECRET: nyc-cleaning-db-pass

steps:
  - id: validate-audit-script
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -euc
      - |
        npm install --global pnpm@10.4.1
        pnpm install --frozen-lockfile
        node --check scripts/audit-legacy-data.mjs

  - id: build-audit-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - .

  - id: push-audit-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

  - id: configure-read-only-audit-job
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_AUDIT_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION}
      - --command=node
      - --args=scripts/audit-legacy-data.mjs
      - --set-env-vars=NODE_ENV=production,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},MYSQL_UNIX_SOCKET=/cloudsql/${_CLOUD_SQL_CONNECTION}
      - --set-secrets=DB_PASS=${_DB_PASS_SECRET}:latest
      - --max-retries=0
      - --task-timeout=5m
      - --quiet

  - id: run-read-only-audit
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_AUDIT_JOB}
      - --region=${_REGION}
      - --wait
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
